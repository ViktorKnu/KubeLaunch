apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubelaunch-frontend
  namespace: ai-demo
  labels:
    app.kubernetes.io/name: ai-demo-frontend
    app.kubernetes.io/part-of: kubelaunch
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kubelaunch.example.com
      secretName: kubelaunch-frontend-tls
  rules:
    - host: kubelaunch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-demo-frontend
                port:
                  number: 8080
